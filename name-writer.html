<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Name Writer</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fredoka:wght@600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#070714;overflow:hidden}
#game{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#ui{position:fixed;left:8px;top:8px;z-index:5;width:210px;font:12px sans-serif;color:#fff;background:#000c;padding:10px;border-radius:10px;display:flex;flex-direction:column;gap:6px}
#ui input,#ui select,#ui button{font:inherit;padding:5px;border-radius:6px;border:0;width:100%;box-sizing:border-box}
#ui button{background:#ff4fd8;color:#fff;cursor:pointer}
#status{opacity:.8;min-height:2em}
.clean #ui{display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
</head><body>
<div id="ui">
  <b>Name Writer</b>
  <input id="vid" placeholder="Live video ID">
  <input id="key" placeholder="YouTube API key" type="password">
  <select id="mode">
    <option value="cmd">Chat command: !name Alex</option>
    <option value="any">Every chatter's display name</option>
  </select>
  <label><input id="paid" type="checkbox" style="width:auto"> Super Chat only</label>
  <button id="go">Connect to chat</button>
  <input id="test" placeholder="Test a name…">
  <button id="add">Write it</button>
  <div id="status">Not connected</div>
</div>
<div id="game"></div>
<script>
const W = 1080, H = 1920;           // 9:16 for Shorts
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
if (params.get('clean')) document.body.classList.add('clean');
try { $('vid').value = params.get('video') || localStorage.nw_vid || ''; $('key').value = params.get('key') || localStorage.nw_key || ''; } catch (e) {}

if (params.get('mode')) $('mode').value = params.get('mode');
$('paid').checked = params.get('paid') === '1';
let scene = null;
const queue = [], lastSeen = {};
function enqueue(name, who, paid) {
  name = (name || '').replace(/^@/, '').replace(/\s+/g, ' ').trim().slice(0, 24);
  if (!name) return;
  if (!paid) {                                              // 1 free reading per person / 2 min
    const k = (who || name).toLowerCase(), now = Date.now();
    if (lastSeen[k] && now - lastSeen[k] < 120000) return;
    lastSeen[k] = now;
  }
  const item = { name, paid: !!paid };
  const i = queue.findIndex(q => !q.paid);                  // Super Chats jump the line
  if (paid) queue.splice(i < 0 ? queue.length : i, 0, item); else queue.push(item);
  if (scene) scene.next();
}

const HOLD_MS = 9000;                       // how long the reading stays on screen
const CW = 250, CH = 400, CY = 1190, CX = [200, 540, 880], DECK = [540, 1190];
const CARDS = [
  ['The Fool', '🐕', 'a leap of faith'], ['The Magician', '🪄', 'the power to make it happen'],
  ['The High Priestess', '🌙', 'quiet intuition'], ['The Empress', '🌹', 'abundance and care'],
  ['The Emperor', '👑', 'structure and authority'], ['The Hierophant', '🔑', 'tradition and guidance'],
  ['The Lovers', '💞', 'a meaningful choice of the heart'], ['The Chariot', '🏇', 'driven momentum'],
  ['Strength', '🦁', 'calm courage'], ['The Hermit', '🏮', 'time for reflection'],
  ['Wheel of Fortune', '☸️', 'a turn of luck'], ['Justice', '⚖️', 'fairness and truth'],
  ['The Hanged Man', '🙃', 'a new angle through pause'], ['Death', '🦋', 'an ending that clears the way'],
  ['Temperance', '🏺', 'balance and patience'], ['The Devil', '🔥', 'tempting attachments'],
  ['The Tower', '⚡', 'sudden upheaval'], ['The Star', '⭐', 'renewed hope'],
  ['The Moon', '🌕', 'hidden feelings'], ['The Sun', '☀️', 'joy and clarity'],
  ['Judgement', '📯', 'a calling to rise'], ['The World', '🌍', 'completion and wholeness']
];
const CLOSERS = [
  n => `${n}, trust the path. The cards are on your side.`,
  n => `${n}, big things are moving your way.`,
  n => `${n}, stay curious. The next chapter is yours to write.`,
  n => `${n}, the stars lean in your favour.`
];

class Main extends Phaser.Scene {
  create() {
    scene = this; this.busy = false;
    const bg = this.textures.createCanvas('bg', W, H), c = bg.context;
    const gr = c.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, '#1a0b3b'); gr.addColorStop(.5, '#0b1b4a'); gr.addColorStop(1, '#2a0b3b');
    c.fillStyle = gr; c.fillRect(0, 0, W, H); bg.refresh();
    this.add.image(W / 2, H / 2, 'bg');
    const d = this.textures.createCanvas('dot', 64, 64), dc = d.context;
    const rg = dc.createRadialGradient(32, 32, 0, 32, 32, 32);
    rg.addColorStop(0, '#fff'); rg.addColorStop(.3, '#ffb6f0'); rg.addColorStop(1, 'rgba(255,79,216,0)');
    dc.fillStyle = rg; dc.fillRect(0, 0, 64, 64); d.refresh();
    this.add.particles(0, 0, 'dot', {
      x: { min: 0, max: W }, y: { min: 0, max: H }, scale: { start: .05, end: .25, ease: 'Sine.easeInOut' },
      alpha: { start: 0, end: 0.8, ease: 'Sine.easeOut' }, lifespan: 2500, frequency: 80, blendMode: 'ADD', yoyo: true
    });
    this.sparks = this.add.particles(0, 0, 'dot', {
      speed: { min: 40, max: 200 }, scale: { start: .35, end: 0 }, lifespan: 700,
      gravityY: 200, blendMode: 'ADD', emitting: false
    });
    const f = { fontFamily: 'Fredoka, sans-serif', color: '#fff', align: 'center' };
    this.add.text(W / 2, 150, 'TYPE  !name YOUR NAME', { ...f, fontSize: '64px' }).setOrigin(.5).setShadow(0, 0, '#00e5ff', 20, true, true);
    this.add.text(W / 2, 225, 'for your tarot reading 🔮', { ...f, fontSize: '42px', color: '#ffd1f5' }).setOrigin(.5);
    this.qText = this.add.text(W / 2, 1870, '', { ...f, fontSize: '36px', color: '#9fe8ff' }).setOrigin(.5);
    this.reading = this.add.text(W / 2, 1420, '', { ...f, fontSize: '38px', color: '#fff3c9', wordWrap: { width: 940 }, lineSpacing: 10 }).setOrigin(.5, 0).setAlpha(0);
    this.next();
  }
  next() {
    this.qText.setText(queue.length ? `${queue.length} waiting…` : '');
    if (this.busy || !queue.length) return;
    this.busy = true;
    this.write(queue.shift());
  }
  makeCard(c) {
    const k = this.add.container(DECK[0], DECK[1]), r = (g, s) => g.fillRoundedRect(-CW / 2, -CH / 2, CW, CH, 18);
    const back = this.add.graphics();
    back.fillStyle(0x2a1060); r(back); back.lineStyle(6, 0xffd36b); back.strokeRoundedRect(-CW / 2, -CH / 2, CW, CH, 18);
    back.lineStyle(2, 0xffd36b); back.strokeRoundedRect(-CW / 2 + 16, -CH / 2 + 16, CW - 32, CH - 32, 10);
    const star = this.add.text(0, 0, '✦', { fontFamily: 'sans-serif', fontSize: '120px', color: '#ffd36b' }).setOrigin(.5);
    const front = this.add.graphics();
    front.fillStyle(0xfff4dc); r(front); front.lineStyle(6, 0xc9922e); front.strokeRoundedRect(-CW / 2, -CH / 2, CW, CH, 18);
    const sym = this.add.text(0, -40, c[1], { fontFamily: 'sans-serif', fontSize: '130px' }).setOrigin(.5);
    const nm = this.add.text(0, 130, c[0], { fontFamily: 'Fredoka, sans-serif', fontSize: '32px', color: '#3b1a5a', align: 'center', wordWrap: { width: 210 } }).setOrigin(.5);
    k.faces = [front, sym, nm]; k.backs = [back, star];
    k.faces.forEach(o => o.setVisible(false));
    k.add([back, star, front, sym, nm]);
    return k;
  }
  flip(k) {
    this.tweens.add({
      targets: k, scaleX: 0, duration: 180, onComplete: () => {
        k.backs.forEach(o => o.setVisible(false)); k.faces.forEach(o => o.setVisible(true));
        this.tweens.add({ targets: k, scaleX: 1, duration: 180 });
      }
    });
  }
  write(item) {
    const name = item.name;
    // ---- tarot: draw 3, build a stacked deck, shuffle it ----
    const pick = Phaser.Utils.Array.Shuffle(CARDS.slice()).slice(0, 3);
    const deck = [];
    for (let i = 0; i < 6; i++) {
      const k = this.makeCard(i >= 3 ? pick[5 - i] : CARDS[0]);
      k.setPosition(DECK[0] + (i - 3) * 2, DECK[1] - i * 3).setAlpha(0);
      deck.push(k);
      this.tweens.add({ targets: k, alpha: 1, duration: 300 });
      this.tweens.add({ targets: k, x: k.x + (i % 2 ? 50 : -50), yoyo: true, duration: 110, repeat: 3, delay: 250 + i * 40 });
    }
    const dealt = [deck[5], deck[4], deck[3]];               // top of the deck first
    dealt.forEach((k, i) => this.time.delayedCall(300 + i * 450, () => {
      this.tweens.add({ targets: k, x: CX[i], y: CY, angle: { from: Phaser.Math.Between(-25, 25), to: 0 }, duration: 500, ease: 'Cubic.easeOut' });
      this.sparks.emitParticleAt(DECK[0], DECK[1], 12);
    }));

    // ---- name writing ----
    const t = this.add.text(W / 2, 760, name, {
      fontFamily: 'Caveat, cursive', fontSize: '260px', color: item.paid ? '#ffe28a' : '#ffffff',
      stroke: item.paid ? '#ff9a00' : '#ff4fd8', strokeThickness: 8
    }).setOrigin(.5).setShadow(0, 0, '#00e5ff', 28, true, true);
    if (t.width > 960) t.setScale(960 / t.width);
    const w = t.displayWidth, h = t.displayHeight, left = t.x - w / 2;
    const g = this.make.graphics(); t.setMask(g.createGeometryMask());
    const pen = this.add.image(left, t.y, 'dot').setBlendMode('ADD').setScale(1.6);
    const prog = { v: 0 };
    this.tweens.add({
      targets: prog, v: 1, duration: Math.min(6000, Math.max(1800, name.length * 380)), ease: 'Sine.easeInOut',
      onUpdate: () => {
        g.clear(); g.fillStyle(0xffffff); g.fillRect(left - 20, t.y - h, (w + 40) * prog.v, h * 2);
        pen.x = left + w * prog.v; pen.y = t.y + Math.sin(prog.v * 50) * h * .22;
        this.sparks.emitParticleAt(pen.x, pen.y, 2);
      },
      onComplete: () => {
        pen.destroy(); g.destroy();
        this.sparks.emitParticleAt(t.x, t.y, 40);
        this.tweens.add({ targets: t, scale: t.scale * 1.06, yoyo: true, duration: 500, repeat: 2 });
        // ---- reveal cards, then the reading ----
        dealt.forEach((k, i) => this.time.delayedCall(300 + i * 450, () => this.flip(k)));
        this.time.delayedCall(1900, () => {
          const [a, b, c] = pick, closer = CLOSERS[Phaser.Math.Between(0, CLOSERS.length - 1)](name);
          this.reading.setText(`Past · ${a[0]}: ${a[2]}.\nPresent · ${b[0]}: ${b[2]}.\nFuture · ${c[0]}: ${c[2]}.\n\n${closer}`);
          this.tweens.add({ targets: this.reading, alpha: 1, duration: 500 });
        });
        this.time.delayedCall(1900 + HOLD_MS, () => this.tweens.add({
          targets: [t, this.reading, ...deck], alpha: 0, duration: 700,
          onComplete: () => { t.destroy(); deck.forEach(k => k.destroy()); this.reading.setText(''); this.busy = false; this.next(); }
        }));
      }
    });
    this.qText.setText(queue.length ? `${queue.length} waiting…` : '');
  }
}

document.fonts.load('700 100px Caveat').then(() => document.fonts.load('600 40px Fredoka')).catch(() => {}).finally(() => {
  new Phaser.Game({
    type: Phaser.AUTO, parent: 'game', width: W, height: H, backgroundColor: '#070714',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }, scene: Main
  });
});

// ---------- shared chat handler ----------
function handleChat(text, author, paid) {
  if ($('paid').checked && !paid) return;                   // Super Chat only mode
  const x = String(text).trim().match(/^!(?:name|write)\s+(.{1,24})/i);
  if (x) enqueue(x[1], author, paid);
  else if ($('mode').value === 'any' || paid) enqueue(author, author, paid);
}

// ---------- local relay (userscript -> relay.js -> here), no API/quota ----------
const status = s => $('status').textContent = s;
(function connectRelay() {
  const es = new EventSource(params.get('relay') || 'http://127.0.0.1:8787/events');
  es.onopen = () => status('Relay connected ✓ waiting for chat…');
  es.onerror = () => status('Relay offline – retrying…');
  es.onmessage = e => { try { const m = JSON.parse(e.data); handleChat(m.text, m.author, m.paid); } catch (x) {} };
})();

// ---------- (optional) YouTube Data API ----------
let polling = false;
$('add').onclick = () => { enqueue($('test').value, 'test' + Math.random()); $('test').value = ''; };
$('go').onclick = async () => {
  const vid = $('vid').value.trim(), key = $('key').value.trim();
  if (!vid || !key) return status('Need video ID + API key');
  try { localStorage.nw_vid = vid; localStorage.nw_key = key; } catch (e) {}
  polling = false; await new Promise(r => setTimeout(r, 50));
  try {
    const v = await (await fetch(`https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${vid}&key=${key}`)).json();
    if (v.error) throw new Error(v.error.message);
    const chatId = v.items?.[0]?.liveStreamingDetails?.activeLiveChatId;
    if (!chatId) throw new Error('No active live chat found');
    polling = true; status('Connected ✓ listening…');
    let token = '', first = true;
    while (polling) {
      const url = `https://www.googleapis.com/youtube/v3/liveChat/messages?liveChatId=${chatId}&part=snippet,authorDetails&pageToken=${token}&key=${key}`;
      const r = await (await fetch(url)).json();
      if (r.error) throw new Error(r.error.message);
      token = r.nextPageToken || token;
      if (!first) for (const m of r.items || []) {
        const text = (m.snippet.displayMessage || '').trim(), author = m.authorDetails.displayName;
        handleChat(text, author, /superChat|superSticker/i.test(m.snippet.type));
      }
      first = false;
      const wait = Math.max(r.pollingIntervalMillis || 0, 7000);
      await new Promise(res => setTimeout(res, wait));
    }
  } catch (e) { polling = false; status('Error: ' + e.message); }
};
</script>
</body></html>
